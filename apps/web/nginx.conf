map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # security headers (API also sets these; defence in depth at the edge)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # hashed assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket / Socket.io reverse-proxy (matches both /socket.io and /socket.io/)
    location /socket.io {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Internal-only Prometheus scrape target. `/api/` forwards everything to
    # the API, which would otherwise expose live request/queue/database metrics
    # to anyone who can reach this edge. The metrics controller stays
    # `@AllowPublic()` so an in-cluster scraper can read it directly at
    # http://api:3000/api/metrics without a user session; the internet-facing
    # route is closed here. 404 (not 403) so the path does not even appear to
    # exist from outside.
    location = /api/metrics {
        return 404;
    }

    # API reverse-proxy (SPA and API co-deployed). Adjust the upstream for
    # split deployments (e.g. proxy_pass http://api:3000;).
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 20m;
    }

    # SPA fallback: every non-file route serves index.html so deep links work
    location / {
        try_files $uri $uri/ /index.html;
    }
}
