<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 32px tab icon keeps the 27 KB brand mark off the critical path; the
         full-size PNG stays as the high-DPI/legacy fallback. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/medu-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) report real values on
         notched iPhones; interactive-widget keeps the Android keyboard from
         resizing the whole app shell. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />

    <meta name="twitter:description" content="Enterprise multi-tenant education management: AI face-recognition attendance, double-entry finance, CRM, LMS and analytics." />

    <!-- Instant branded boot shell: Apple VisionOS Luxury Liquid Glass Edition -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 48%, #ffffff 0%, #f6f8fd 45%, #e9eef8 100%);
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      html.dark #boot-splash, html.oled #boot-splash {
        background: radial-gradient(circle at 50% 48%, #0d1222 0%, #060911 55%, #020408 100%);
      }
      #boot-splash.is-hidden {
        opacity: 0;
        transform: scale(1.04);
        filter: blur(14px);
        pointer-events: none;
      }

      /* Multi-harmonic Atmospheric Spatial Glow */
      .boot-splash__glow {
        position: absolute;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(168, 85, 247, 0.16) 42%, rgba(56, 189, 248, 0.08) 65%, transparent 75%);
        filter: blur(65px);
        animation: boot-pulse-glow 4s ease-in-out infinite alternate;
        pointer-events: none;
      }
      html.dark .boot-splash__glow, html.oled .boot-splash__glow {
        background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(139, 92, 246, 0.22) 45%, rgba(56, 189, 248, 0.12) 68%, transparent 78%);
        filter: blur(75px);
      }

      .boot-splash__container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 1;
      }

      /* Apple VisionOS Spatial Floating Badge with Specular Reflection */
      .boot-splash__badge-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-splash__aura {
        position: absolute;
        width: 124px;
        height: 124px;
        border-radius: 40px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(168, 85, 247, 0.35) 50%, transparent 75%);
        filter: blur(24px);
        animation: boot-pulse-aura 3s ease-in-out infinite alternate;
        z-index: -1;
      }

      .boot-splash__ring {
        position: absolute;
        width: 114px;
        height: 114px;
        border-radius: 36px;
        border: 1px solid rgba(139, 92, 246, 0.35);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.18);
        animation: boot-pulse-ring 3.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        pointer-events: none;
        z-index: -1;
      }
      html.dark .boot-splash__ring {
        border-color: rgba(168, 85, 247, 0.35);
        box-shadow: 0 0 28px rgba(139, 92, 246, 0.3);
      }

      /* 3D Liquid Titanium & Sapphire Glass Icon */
      .boot-splash__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 82px;
        height: 82px;
        border-radius: 26px;
        background: linear-gradient(145deg, #4338ca 0%, #6366f1 35%, #8b5cf6 75%, #a855f7 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.45) inset,
          0 2px 3px rgba(255, 255, 255, 0.75) inset,
          0 -2px 4px rgba(0, 0, 0, 0.25) inset,
          0 20px 45px -8px rgba(79, 70, 229, 0.65),
          0 30px 60px -12px rgba(139, 92, 246, 0.45);
        color: #ffffff;
        overflow: hidden;
        animation: boot-float 3.6s ease-in-out infinite;
      }

      .boot-splash__logo {
        width: 38px;
        height: 38px;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.3));
        z-index: 1;
      }

      /* Fluid Diamond Specular Sheen Sweep */
      .boot-splash__shine {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 0%,
          transparent 35%,
          rgba(255, 255, 255, 0.5) 48%,
          rgba(255, 255, 255, 0.8) 50%,
          rgba(255, 255, 255, 0.5) 52%,
          transparent 65%,
          transparent 100%
        );
        transform: translateX(-140%);
        animation: boot-shimmer 2.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Brand Typography — Apple VisionOS Precision Header */
      .boot-splash__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
      }

      .boot-splash__title {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.32em;
        margin-right: -0.32em;
        color: #0f172a;
        text-transform: uppercase;
        background: linear-gradient(180deg, #0f172a 0%, #334155 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.08));
      }
      html.dark .boot-splash__title, html.oled .boot-splash__title {
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.2));
      }

      .boot-splash__tag {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.38em;
        margin-right: -0.38em;
        color: #4f46e5;
        text-transform: uppercase;
        opacity: 0.95;
      }
      html.dark .boot-splash__tag, html.oled .boot-splash__tag {
        color: #a5b4fc;
        opacity: 0.9;
        text-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
      }

      /* Laser Aurora Liquid Glass Progress Capsule */
      .boot-splash__bar {
        position: relative;
        width: 148px;
        height: 4px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05) inset;
      }
      html.dark .boot-splash__bar, html.oled .boot-splash__bar {
        background: rgba(255, 255, 255, 0.09);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      }

      .boot-splash__bar-core {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent 0%, #4f46e5 25%, #8b5cf6 65%, #38bdf8 100%);
        box-shadow: 0 0 16px 2px rgba(139, 92, 246, 0.85);
        animation: boot-bar-slide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Keyframe Choreography */
      @keyframes boot-pulse-glow {
        0% { transform: scale(0.92); opacity: 0.65; }
        100% { transform: scale(1.15); opacity: 0.95; }
      }
      @keyframes boot-pulse-aura {
        0% { transform: scale(0.94); opacity: 0.55; }
        100% { transform: scale(1.22); opacity: 0.92; }
      }
      @keyframes boot-pulse-ring {
        0% { transform: scale(0.9); opacity: 0.85; }
        70% { transform: scale(1.3); opacity: 0; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes boot-shimmer {
        0% { transform: translateX(-140%); }
        45%, 100% { transform: translateX(180%); }
      }
      @keyframes boot-bar-slide {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(280%); }
      }

      .boot-splash__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash__glow,
        .boot-splash__aura,
        .boot-splash__ring,
        .boot-splash__mark,
        .boot-splash__shine {
          animation: none !important;
        }
        .boot-splash__bar-core {
          animation: none;
          width: 100%;
        }
        #boot-splash {
          transition: none;
        }
      }
    </style>

    <!-- Security baseline for the static shell (real headers are set in nginx) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('medu-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = t;
          if (t === 'system') {
            resolved = prefersDark ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.remove('dark', 'oled', 'sepia', 'light');
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else if (resolved === 'oled') {
            root.classList.add('dark', 'oled');
            root.setAttribute('data-theme', 'oled');
            root.style.colorScheme = 'dark';
          } else if (resolved === 'sepia') {
            root.classList.add('sepia');
            root.setAttribute('data-theme', 'sepia');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
          var lang = localStorage.getItem('medu-lang') || 'uz';
          if (lang) {
            root.setAttribute('lang', lang);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-live="polite" aria-busy="true" aria-label="M-EDU platformasi yuklanmoqda">
      <span class="boot-splash__sr-only">M-EDU ta'lim platformasi yuklanmoqda... Loading M-EDU ecosystem...</span>
      <div class="boot-splash__glow"></div>
      <div class="boot-splash__container">
        <div class="boot-splash__badge-wrapper">
          <div class="boot-splash__aura"></div>
          <div class="boot-splash__ring"></div>
          <div class="boot-splash__mark">
            <svg class="boot-splash__logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M6 24V8.5C6 7.67 6.67 7 7.5 7H9.2C9.8 7 10.35 7.35 10.6 7.9L16 16.8L21.4 7.9C21.65 7.35 22.2 7 22.8 7H24.5C25.33 7 26 7.67 26 8.5V24C26 24.55 25.55 25 25 25H22.8C22.25 25 21.8 24.55 21.8 24V14.5L17.4 21.4C17.1 21.9 16.58 22.2 16 22.2C15.42 22.2 14.9 21.9 14.6 21.4L10.2 14.5V24C10.2 24.55 9.75 25 9.2 25H7C6.45 25 6 24.55 6 24Z" fill="currentColor"/>
            </svg>
            <div class="boot-splash__shine"></div>
          </div>
        </div>
        <div class="boot-splash__brand">
          <span class="boot-splash__title">M-EDU</span>
          <span class="boot-splash__tag">INTELLIGENT ECOSYSTEM</span>
        </div>
        <div class="boot-splash__bar">
          <div class="boot-splash__bar-core"></div>
        </div>
      </div>
    </div>
    <noscript>
      <style>#boot-splash { display: none !important; }</style>
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#334155;text-align:center;padding:20px;">
        <p>M-EDU platformasidan foydalanish uchun brauzeringizda JavaScript-ni yoqing.<br /><span style="font-size:0.875rem;color:#64748b;">M-EDU requires JavaScript to run. Please enable JavaScript in your browser.</span></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
