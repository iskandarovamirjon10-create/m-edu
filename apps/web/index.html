<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/medu-logo.png" />
    <link rel="apple-touch-icon" href="/medu-logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) report real values on
         notched iPhones; interactive-widget keeps the Android keyboard from
         resizing the whole app shell. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary meta -->
    <title>M-EDU — Education Center Management Platform</title>
    <meta name="description" content="M-EDU is a multi-tenant education center management platform with face-recognition attendance, CRM, payments, schedules and analytics." />
    <meta name="theme-color" content="#274ee3" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M-EDU" />
    <meta property="og:url" content="/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="M-EDU — Education Center Management Platform" />
    <meta property="og:description" content="Multi-tenant education management: face-recognition attendance, CRM, payments, schedules and analytics in one platform." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="M-EDU — Education Center Management Platform" />
    <meta name="twitter:description" content="Multi-tenant education management: face-recognition attendance, CRM, payments, schedules and analytics." />

    <!-- Performance: preconnect to same-origin API (served behind nginx /api) -->
    <link rel="preconnect" href="/" />

    <!-- Security baseline for the static shell (real headers are set in nginx) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('medu-theme');
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <noscript>
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#334155">
        <p>M-EDU requires JavaScript to run. Please enable JavaScript in your browser.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
