<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 32px tab icon keeps the 27 KB brand mark off the critical path; the
         full-size PNG stays as the high-DPI/legacy fallback. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/medu-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) report real values on
         notched iPhones; interactive-widget keeps the Android keyboard from
         resizing the whole app shell. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M-EDU" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Primary meta -->
    <title>M-EDU v2 — Enterprise Education Management Platform</title>
    <meta name="description" content="M-EDU v2 is an enterprise multi-tenant education management platform with biometric face-recognition attendance, double-entry financial billing, CRM, LMS and analytics." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M-EDU v2" />
    <meta property="og:url" content="/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="M-EDU v2 — Enterprise Education Management Platform" />
    <meta property="og:description" content="Enterprise multi-tenant education management: AI face-recognition attendance, double-entry finance, CRM, LMS and analytics." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="M-EDU v2 — Enterprise Education Management Platform" />
    <meta name="twitter:description" content="Enterprise multi-tenant education management: AI face-recognition attendance, double-entry finance, CRM, LMS and analytics." />

    <!-- Instant branded boot shell: paints before the JS bundle is parsed, then
         main.tsx fades it out after React commits its first frame. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f1f4fa 55%, #e6ebf5 100%);
        transition: opacity 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      html.dark #boot-splash, html.oled #boot-splash {
        background: radial-gradient(circle at 50% 45%, #131b2e 0%, #0a0e17 60%, #05070c 100%);
      }
      #boot-splash.is-hidden {
        opacity: 0;
        transform: scale(1.035);
        filter: blur(8px);
        pointer-events: none;
      }

      /* Atmospheric Ambient Background Glow */
      .boot-splash__glow {
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(168, 85, 247, 0.12) 40%, transparent 70%);
        filter: blur(45px);
        animation: boot-pulse-glow 3.5s ease-in-out infinite alternate;
        pointer-events: none;
      }
      html.dark .boot-splash__glow, html.oled .boot-splash__glow {
        background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(139, 92, 246, 0.18) 45%, transparent 72%);
        filter: blur(55px);
      }

      .boot-splash__container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 1;
      }

      /* Concentric pulsating glass aura ring */
      .boot-splash__aura {
        position: absolute;
        top: -8px;
        width: 84px;
        height: 84px;
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(168, 85, 247, 0.35));
        filter: blur(14px);
        animation: boot-pulse-aura 2.4s ease-in-out infinite;
        z-index: -1;
      }

      .boot-splash__ring {
        position: absolute;
        top: -14px;
        width: 96px;
        height: 96px;
        border-radius: 30px;
        border: 1px solid rgba(99, 102, 241, 0.18);
        animation: boot-pulse-ring 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        pointer-events: none;
        z-index: -1;
      }
      html.dark .boot-splash__ring {
        border-color: rgba(139, 92, 246, 0.25);
      }

      /* 3D Liquid Glass Mark */
      .boot-splash__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 40%, #8b5cf6 80%, #a855f7 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.32) inset,
          0 1.5px 2px rgba(255, 255, 255, 0.55) inset,
          0 16px 36px -8px rgba(79, 70, 229, 0.55),
          0 24px 48px -12px rgba(139, 92, 246, 0.35);
        color: #ffffff;
        overflow: hidden;
        animation: boot-float 3s ease-in-out infinite;
      }

      .boot-splash__logo {
        width: 32px;
        height: 32px;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.22));
        z-index: 1;
      }

      /* Metallic glass specular shimmer */
      .boot-splash__shine {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 0%,
          transparent 40%,
          rgba(255, 255, 255, 0.38) 50%,
          transparent 60%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: boot-shimmer 2.6s infinite ease-in-out;
      }

      /* Brand Typography */
      .boot-splash__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        margin-top: 2px;
      }

      .boot-splash__title {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        color: #0f172a;
        text-transform: uppercase;
        background: linear-gradient(180deg, #1e293b 0%, #475569 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      html.dark .boot-splash__title, html.oled .boot-splash__title {
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .boot-splash__tag {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-indent: 0.26em;
        color: #64748b;
        text-transform: uppercase;
        opacity: 0.85;
      }
      html.dark .boot-splash__tag, html.oled .boot-splash__tag {
        color: #94a3b8;
        opacity: 0.75;
      }

      /* Aurora Fluid Progress Capsule */
      .boot-splash__bar {
        position: relative;
        width: 136px;
        height: 4px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04) inset;
      }
      html.dark .boot-splash__bar, html.oled .boot-splash__bar {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      }

      .boot-splash__bar-core {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 48%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent 0%, #4f46e5 35%, #8b5cf6 70%, #ec4899 100%);
        box-shadow: 0 0 12px 1px rgba(139, 92, 246, 0.7);
        animation: boot-bar-slide 1.4s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }

      /* Keyframe Choreography */
      @keyframes boot-pulse-glow {
        0% { transform: scale(0.92); opacity: 0.65; }
        100% { transform: scale(1.15); opacity: 0.95; }
      }
      @keyframes boot-pulse-aura {
        0%, 100% { transform: scale(0.95); opacity: 0.55; }
        50% { transform: scale(1.18); opacity: 0.95; }
      }
      @keyframes boot-pulse-ring {
        0% { transform: scale(0.88); opacity: 0.8; }
        60% { transform: scale(1.22); opacity: 0; }
        100% { transform: scale(1.22); opacity: 0; }
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes boot-shimmer {
        0% { transform: translateX(-120%); }
        35%, 100% { transform: translateX(160%); }
      }
      @keyframes boot-bar-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(250%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash__glow,
        .boot-splash__aura,
        .boot-splash__ring,
        .boot-splash__mark,
        .boot-splash__shine {
          animation: none !important;
        }
        .boot-splash__bar-core {
          animation: none;
          width: 100%;
        }
        #boot-splash {
          transition: none;
        }
      }
    </style>

    <!-- Security baseline for the static shell (real headers are set in nginx) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('medu-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = t;
          if (t === 'system') {
            resolved = prefersDark ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.remove('dark', 'oled', 'sepia', 'light');
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else if (resolved === 'oled') {
            root.classList.add('dark', 'oled');
            root.setAttribute('data-theme', 'oled');
            root.style.colorScheme = 'dark';
          } else if (resolved === 'sepia') {
            root.classList.add('sepia');
            root.setAttribute('data-theme', 'sepia');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__glow"></div>
      <div class="boot-splash__container">
        <div class="boot-splash__aura"></div>
        <div class="boot-splash__ring"></div>
        <div class="boot-splash__mark">
          <svg class="boot-splash__logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 24V8.5C6 7.67 6.67 7 7.5 7H9.2C9.8 7 10.35 7.35 10.6 7.9L16 16.8L21.4 7.9C21.65 7.35 22.2 7 22.8 7H24.5C25.33 7 26 7.67 26 8.5V24C26 24.55 25.55 25 25 25H22.8C22.25 25 21.8 24.55 21.8 24V14.5L17.4 21.4C17.1 21.9 16.58 22.2 16 22.2C15.42 22.2 14.9 21.9 14.6 21.4L10.2 14.5V24C10.2 24.55 9.75 25 9.2 25H7C6.45 25 6 24.55 6 24Z" fill="currentColor"/>
          </svg>
          <div class="boot-splash__shine"></div>
        </div>
        <div class="boot-splash__brand">
          <span class="boot-splash__title">M-EDU</span>
          <span class="boot-splash__tag">INTELLIGENT ECOSYSTEM</span>
        </div>
        <div class="boot-splash__bar">
          <div class="boot-splash__bar-core"></div>
        </div>
      </div>
    </div>
    <noscript>
      <style>#boot-splash { display: none !important; }</style>
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#334155">
        <p>M-EDU requires JavaScript to run. Please enable JavaScript in your browser.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
