<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Blur and Glow Filters -->
    <filter id="glow-solar-phoenix" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="35.84" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20.48" stdDeviation="30.72" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-main-solar-phoenix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF4B2B" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="grad-glass-solar-phoenix" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="grad-core-solar-phoenix" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF416C" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#FF4B2B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="grad-rim-solar-phoenix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF416C" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep Aura Core -->
  <circle cx="512" cy="512" r="494.5919999999999" fill="url(#grad-core-solar-phoenix)" />

  <!-- Outer Cyber Rings -->
  <circle cx="512" cy="512" r="430.08" fill="none" stroke="#FFD700" stroke-width="8.192" stroke-dasharray="40.96 20.48" opacity="0.75" />
  <circle cx="512" cy="512" r="404.2752" fill="none" stroke="url(#grad-rim-solar-phoenix)" stroke-width="4.096" opacity="0.6" />

  

  
  <!-- Victory Crown Glow & Starburst -->
  <circle cx="512" cy="512" r="451.584" fill="none" stroke="#FFD700" stroke-width="12.288" stroke-dasharray="20.48 30.72" />
  <polygon points="512,38.91199999999998 563.2,116.32639999999998 512,99.12320000000005 460.8,116.32639999999998" fill="#FFD700" />
  

  <!-- Main Cyber-Glass Vessel (PBR Spherical Capsule) -->
  <g filter="url(#drop-shadow)">
    <!-- Base Body Sphere -->
    <circle cx="512" cy="512" r="378.4704" fill="#0A0F1D" />
    <circle cx="512" cy="512" r="378.4704" fill="url(#grad-main-solar-phoenix)" opacity="0.32" />
    <circle cx="512" cy="512" r="378.4704" fill="url(#grad-glass-solar-phoenix)" />

    <!-- Inner Radial Glow -->
    <circle cx="512" cy="512" r="344.064" fill="none" stroke="url(#grad-main-solar-phoenix)" stroke-width="12.288" filter="url(#glow-solar-phoenix)" opacity="0.85" />
  </g>

  <!-- Central Character Holographic Silhouette & Monogram Emblem -->
  <g transform="translate(512, 486.4)">
    <!-- Emblem Backing Hexagon -->
    <polygon points="0,-225.28 194.56,-112.64 194.56,112.64 0,225.28 -194.56,112.64 -194.56,-112.64" 
      fill="rgba(10, 15, 29, 0.7)" stroke="#F9D423" stroke-width="6.144" opacity="0.9" />

    <!-- 3D Geometric Character Silhouette Anchor -->
    <circle cx="0" cy="0" r="143.36" fill="url(#grad-main-solar-phoenix)" opacity="0.25" filter="url(#glow-solar-phoenix)" />

    <!-- Character Symbol Avatar Feature -->
    <text x="0" y="51.2" font-family="system-ui, -apple-system, sans-serif" font-size="163.84" text-anchor="middle" dominant-baseline="middle" filter="url(#drop-shadow)">🔥</text>
  </g>

  <!-- Specular Highlights (Liquid Glass Refraction) -->
  <ellipse cx="512" cy="275.456" rx="206.43839999999997" ry="77.4144" fill="#ffffff" opacity="0.22" />
  <ellipse cx="318.464" cy="361.472" rx="64.512" ry="34.4064" fill="#ffffff" opacity="0.35" transform="rotate(-25, 318.464, 361.472)" />

  <!-- Lower Cyber Identification Nameplate -->
  <g transform="translate(512, 791.552)">
    <rect x="-286.72" y="-51.2" width="573.44" height="92.16" rx="25.6" 
      fill="rgba(11, 15, 25, 0.85)" stroke="url(#grad-rim-solar-phoenix)" stroke-width="4.096" filter="url(#drop-shadow)" />
    <text x="0" y="-5.12" font-family="'Segoe UI', Roboto, sans-serif" font-size="38.912" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      SOLAR PHOENIX
    </text>
    <text x="0" y="26.624" font-family="'Segoe UI', Roboto, sans-serif" font-size="22.528" font-weight="600" fill="#F9D423" text-anchor="middle" letter-spacing="1">
      VICTORY
    </text>
  </g>
</svg>