<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-EDU — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 400px;
      border-radius: 1.5rem;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
    }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #8473fc, #6c5ce7);
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.5rem; color: white;
      box-shadow: 0 4px 20px rgba(84,115,252,0.4);
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.6; }
    button {
      padding: 0.75rem 2rem;
      border: none; border-radius: 0.75rem;
      background: linear-gradient(135deg, #8473fc, #6c5ce7);
      color: white; font-size: 1rem; font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(84,115,252,0.4);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(84,115,252,0.6); }
    button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">M</div>
    <h1>You are offline</h1>
    <p>Please check your internet connection. Some features may be unavailable until you reconnect.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
