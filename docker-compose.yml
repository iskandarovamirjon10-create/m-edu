services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?put a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medu}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medu} -d ${POSTGRES_DB:-medu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medu}:${POSTGRES_PASSWORD:?put a strong POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-medu}?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Pin the INTERNAL port to 3000: the host port mapping, the nginx proxy
      # (apps/web/nginx.conf → http://api:3000) and the Docker HEALTHCHECK all
      # target 3000, but a stray PORT=3001 in the environment previously made
      # the container listen on a dead port. Pin it explicitly here.
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medu}:${POSTGRES_PASSWORD:?put a strong POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-medu}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-${NEXT_PUBLIC_APP_URL:-http://localhost:8080}}
      - BIOMETRIC_ENCRYPTION_KEY=${BIOMETRIC_ENCRYPTION_KEY}
      - FACE_ENGINE_PROVIDER=${FACE_ENGINE_PROVIDER:-real-local}
      # The ONNX models ship in the repository under packages/face-engine/models
      # and the api image copies /app/packages, so these paths must be the real
      # files. The previous defaults (/models/face_detector.onnx) pointed at
      # nothing, and the blank liveness default made production refuse to boot
      # (validateConfig + the real-local engine both require all three paths).
      - FACE_DETECTOR_MODEL_PATH=${FACE_DETECTOR_MODEL_PATH:-/app/packages/face-engine/models/face_detection_yunet_2023mar.onnx}
      - FACE_EMBEDDER_MODEL_PATH=${FACE_EMBEDDER_MODEL_PATH:-/app/packages/face-engine/models/face_recognition_sface_2021dec.onnx}
      - FACE_LIVENESS_MODEL_PATH=${FACE_LIVENESS_MODEL_PATH:-/app/packages/face-engine/models/minifasnet_v2.onnx}
      - OAUTH_SESSION_SECRET=${OAUTH_SESSION_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@medu.test}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - TRUST_PROXY=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    # NOTE: no `env_file: .env` here. `.env` is git-ignored and absent on a fresh
    # clone, which made `docker compose up` fail with "env file ... not found".
    # Compose already reads the project `.env` (or --env-file) for the `${...}`
    # substitutions below; the explicit `environment` block is the source of truth.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        # The web app must not come up before the API answers /api/health:
        # nginx proxies every /api call, so an early start serves 502s until
        # the API is ready. The API image carries a HEALTHCHECK on that route.
        condition: service_healthy
      migration:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
