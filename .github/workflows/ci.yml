name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      # Dependency audit gate: fail on CRITICAL advisories in production deps
      # only, so a flood of dev-only/low advisories does not block every push.
      - name: Dependency audit (production, critical only)
        run: npm audit --omit=dev --audit-level=critical

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      # Fresh `npm ci` installs the @prisma/client *stub* (no enums, throws on
      # `new PrismaClient()`). Every job that typechecks/builds/runs the API
      # needs the generated client first, or `import { Role }` fails TS2305.
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Lint
        run: npm run lint
      # DS-06 ratchet: the existing hardcoded Cyrillic debt is frozen in
      # scripts/i18n-cyrillic-baseline.json. New literals fail; migrating old
      # ones is always allowed.
      - name: Hardcoded Cyrillic ratchet
        run: node scripts/check-hardcoded-cyrillic.cjs

  test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medu
          POSTGRES_PASSWORD: medu
          POSTGRES_DB: medu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://medu:medu@127.0.0.1:5432/medu_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      BIOMETRIC_ENCRYPTION_KEY: ci-biometric-encryption-key-32-chars-min
      FACE_ENGINE_PROVIDER: mock
      REDIS_ENABLED: "true"
      # Rate limits: the full e2e suite issues far more than the production
      # ceiling from a single CI IP — raise (not disable) for this run so the
      # limiter stays exercised instead of failing unrelated tests with 429.
      THROTTLE_DEFAULT_LIMIT: "1000000"
      THROTTLE_SECURITY_LIMIT: "100000"
      E2E_BASE_URL: http://127.0.0.1:3001
      E2E_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      # TEST-01: coverage was configured in both vitest configs but never
      # executed, so the 70/60 thresholds could not fail a build. Run the suite
      # through --coverage so the gate is real.
      - name: Unit tests with coverage
        run: |
          npm run test -w @medu/api -- --coverage
          npm run test -w @medu/web -- --coverage
      - name: Prisma validate
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Prisma migrate status
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      # Fail the build when schema.prisma and the replayed migration history
      # disagree (drift). Prisma 5.x requires a shadow database to replay
      # --from-migrations; the service user above can create/drop it. Exit code
      # 2 (non-empty diff) fails the step.
      - name: Prisma migration drift check
        working-directory: apps/api
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
      - name: Integration tests
        run: npm run test:integration
      # ---- API end-to-end suite (root cause: a server must exist) ----
      - name: Build API
        run: npm run build -w @medu/api
      - name: Start API for E2E (background)
        run: |
          node apps/api/dist/main.js > api-e2e.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for API health (race guard)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null 2>&1; then
              echo "API healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 120s"
          cat api-e2e.log
          exit 1
      - name: E2E tests (vitest, real HTTP against the running API)
        run: npm run test:e2e
      # ---- Browser smoke (Playwright reuses the API, boots web preview) ----
      - name: Build web
        run: npm run build -w @medu/web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (Playwright)
        run: npx playwright test
      - name: API logs on failure
        if: failure()
        run: cat api-e2e.log || true

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Build
        run: npm run build
